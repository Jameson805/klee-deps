[[benchmarks]]
benchmark_id = "appliedcryp"
display_name = "appliedCryp"
library_id = "unknown"
code_path = "benchmarks/appliedCryp"
path_prefixes = ["benchmarks/appliedCryp/"]
tools = ["klee_cf", "klee_eager", "self_comp", "binsec", "abacus"]

[benchmarks.builds.abacus]
script = "benchmarks/appliedCryp/build.sh"
tool_flag = "--abacus"
preset = "default"

[benchmarks.builds.self_comp]
script = "benchmarks/appliedCryp/build.sh"
tool_flag = "--self-comp"
preset = "default"

[benchmarks.builds.binsec]
script = "benchmarks/appliedCryp/build.sh"
tool_flag = "--binsec"
preset = "default"

[benchmarks.builds.klee]
script = "benchmarks/appliedCryp/build.sh"
tool_flag = "--klee"
preset = "default"

[benchmarks.build_aliases]
klee_cf = "klee"
klee_eager = "klee"

[benchmarks.mode_case_templates]
abacus_executable = "benchmarks/appliedCryp/abacus_{public_mode}_{artifact_suffix}"
self_comp_bitcode = "benchmarks/appliedCryp/self_comp_{public_mode}_{artifact_suffix}.bc"
self_comp_replay_executable = "klee_{public_mode}_replay_{artifact_suffix}"
binsec_sse_script = "benchmarks/appliedCryp/generated/{artifact_suffix}/binsec_{public_mode}.cfg"
binsec_executable = "benchmarks/appliedCryp/binsec_{public_mode}_{artifact_suffix}"
klee_bitcode = "benchmarks/appliedCryp/klee_{public_mode}_{artifact_suffix}.bc"
klee_replay_script = "benchmarks/appliedCryp/klee_{public_mode}_replay_{artifact_suffix}"

[[benchmarks.mode_cases]]
display_name = "3-WAY"
artifact_suffix = "3way"
output_stem = "appliedcryp_3way"
replay_opts = "--secret key,data"
ct_json = "ctchecker_results/OriginalBenchmarks/empty.json"
memory_flag = true
secret_layout = "key:12,data:12"
secret_inputs = ["key:12:key_buf", "data:12:data_buf"]
runner_config = "configs/runner/appliedcryp_3way_runner_config.toml"
preset_name = "default"

[[benchmarks.mode_cases]]
display_name = "DES"
artifact_suffix = "des"
output_stem = "appliedcryp_des"
replay_opts = "--secret key,data"
ct_json = "ctchecker_results/OriginalBenchmarks/empty.json"
memory_flag = true
secret_layout = "key:24,data:8"
secret_inputs = ["key:24:key_buf", "data:8:data_buf"]
runner_config = "configs/runner/appliedcryp_des_runner_config.toml"
preset_name = "default"

[[benchmarks.mode_cases]]
display_name = "LOKI91"
artifact_suffix = "loki91"
output_stem = "appliedcryp_loki91"
replay_opts = "--secret key,data"
ct_json = "ctchecker_results/OriginalBenchmarks/empty.json"
memory_flag = true
secret_layout = "key:24,data:8"
secret_inputs = ["key:24:key_buf", "data:8:data_buf"]
runner_config = "configs/runner/appliedcryp_loki91_runner_config.toml"
preset_name = "default"
