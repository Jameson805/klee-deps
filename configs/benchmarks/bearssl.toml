[[benchmarks]]
library = "bearssl"
code_path = "benchmarks/bearssl"
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec", "abacus"]

[benchmarks.runner_profiles.aes_big]
config = "configs/runner/bearssl_aes_big_runner_config.toml"
preset = "default"

[benchmarks.runner_profiles.aes_ct]
config = "configs/runner/bearssl_aes_ct_runner_config.toml"
preset = "default"

[benchmarks.runner_profiles.des_tab]
config = "configs/runner/bearssl_des_tab_runner_config.toml"
preset = "default"

[benchmarks.runner_profiles.des_ct]
config = "configs/runner/bearssl_des_ct_runner_config.toml"
preset = "default"

[benchmarks.runner_profiles.default]
config = "configs/runner/modexp_runner_config.toml"
preset = "size_{sym_size}"

[benchmarks.runner_profiles.rsa_private]
config = "configs/runner/bearssl_rsa_private_runner_config.toml"
preset = "size_{sym_size}"

[benchmarks.runner_profiles.rsa_padding]
config = "configs/runner/bearssl_rsa_padding_runner_config.toml"
preset = "size_{sym_size}"

[benchmarks.build]
preset = "default"
common_flags = ["-g", "-O0"]
include_dirs = ["{repo_root}/include", "bearssl-0.6/inc", "bearssl-0.6/src"]

[benchmarks.build.tools.abacus]
concrete_pubs = false

[benchmarks.variants.aes_des]

[[benchmarks.variants.aes_des.targets]]
target = "aes_big"
runner_profile = "aes_big"
build_sources = [
	"aes_big_wrapper.c",
	"bearssl-0.6/src/symcipher/aes_big_cbcenc.c",
	"bearssl-0.6/src/symcipher/aes_big_enc.c",
	"bearssl-0.6/src/symcipher/aes_common.c",
]
secret_layout = "skey:240"
secret_inputs = ["skey:240:skey_buf"]
public_layout = "data:32,iv:16"
public_inputs = ["data:32:data_buf", "iv:16:iv_buf"]
klee_secret_inputs = ["skey"]
klee_public_inputs = ["data", "iv"]

[[benchmarks.variants.aes_des.targets]]
target = "aes_ct"
runner_profile = "aes_ct"
build_sources = [
	"aes_ct_wrapper.c",
	"bearssl-0.6/src/symcipher/aes_ct_cbcenc.c",
	"bearssl-0.6/src/symcipher/aes_ct.c",
	"bearssl-0.6/src/symcipher/aes_ct_enc.c",
]
secret_layout = "skey:240"
secret_inputs = ["skey:240:skey_buf"]
public_layout = "data:32,iv:16"
public_inputs = ["data:32:data_buf", "iv:16:iv_buf"]
klee_secret_inputs = ["skey"]
klee_public_inputs = ["data", "iv"]

[[benchmarks.variants.aes_des.targets]]
target = "des_ct"
runner_profile = "des_ct"
build_sources = [
	"des_ct_wrapper.c",
	"bearssl-0.6/src/symcipher/des_ct_cbcenc.c",
	"bearssl-0.6/src/symcipher/des_ct.c",
	"bearssl-0.6/src/symcipher/des_support.c",
]
secret_layout = "skey:384"
secret_inputs = ["skey:384:skey_buf"]
public_layout = "data:16,iv:8"
public_inputs = ["data:16:data_buf", "iv:8:iv_buf"]
klee_secret_inputs = ["skey"]
klee_public_inputs = ["data", "iv"]

[[benchmarks.variants.aes_des.targets]]
target = "des_tab"
runner_profile = "des_tab"
build_sources = [
	"des_tab_wrapper.c",
	"bearssl-0.6/src/symcipher/des_tab_cbcenc.c",
	"bearssl-0.6/src/symcipher/des_tab.c",
	"bearssl-0.6/src/symcipher/des_support.c",
]
secret_layout = "skey:384"
secret_inputs = ["skey:384:skey_buf"]
public_layout = "data:16,iv:8"
public_inputs = ["data:16:data_buf", "iv:8:iv_buf"]
klee_secret_inputs = ["skey"]
klee_public_inputs = ["data", "iv"]

[benchmarks.variants.modexp.build]
preset = "size_{sym_size}"
common_flags = ["-g", "-O0"]
include_dirs = ["{repo_root}/include", "bearssl-0.6/inc", "bearssl-0.6/src"]

[benchmarks.variants.modexp.build.tools.abacus]
concrete_pubs = false

[benchmarks.variants.modexp.tool_defaults.klee]
code_path = "benchmarks/bearssl/bearssl-0.6/src/int"
secret_inputs = ["exp"]
public_inputs = ["base", "mod"]
mod_exp_extra_args = ["--filename", "i32_modpow.c", "--lines", "29:64"]

[[benchmarks.variants.modexp.targets]]
target = "modexp"
runner_profile = "default"
secret_inputs = ["exp:{sym_size}:exp_buf"]
public_inputs = ["base:{sym_size}:base_buf", "mod:{sym_size}:mod_buf"]
build_sources = [
	"modexp_wrapper.c",
	"bearssl-0.6/src/codec/ccopy.c",
	"bearssl-0.6/src/int/i32_add.c",
	"bearssl-0.6/src/int/i32_bitlen.c",
	"bearssl-0.6/src/int/i32_decode.c",
	"bearssl-0.6/src/int/i32_decmod.c",
	"bearssl-0.6/src/int/i32_decred.c",
	"bearssl-0.6/src/int/i32_div32.c",
	"bearssl-0.6/src/int/i32_encode.c",
	"bearssl-0.6/src/int/i32_fmont.c",
	"bearssl-0.6/src/int/i32_iszero.c",
	"bearssl-0.6/src/int/i32_modpow.c",
	"bearssl-0.6/src/int/i32_montmul.c",
	"bearssl-0.6/src/int/i32_mulacc.c",
	"bearssl-0.6/src/int/i32_muladd.c",
	"bearssl-0.6/src/int/i32_ninv32.c",
	"bearssl-0.6/src/int/i32_reduce.c",
	"bearssl-0.6/src/int/i32_sub.c",
	"bearssl-0.6/src/int/i32_tmont.c",
]

[[benchmarks.variants.modexp.configs]]
config = "fix_pub"
public_mode = "fix_pub"
runner_profile = "default"

[[benchmarks.variants.modexp.configs]]
config = "var_pub"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec"]
use_public_inputs = true

[benchmarks.variants.rsa_stages.tool_defaults.klee]
code_path = "benchmarks/bearssl/bearssl-0.6/src/rsa"
extra_args = ["--ctchecker-prefix", "rsa"]

[benchmarks.variants.rsa_stages.build]
preset = "size_{sym_size}"
common_flags = ["-g", "-O0"]
include_dirs = ["{repo_root}/include", "bearssl-0.6/inc", "bearssl-0.6/src"]

[[benchmarks.variants.rsa_stages.targets]]
target = "rsa_i31_private"
runner_profile = "rsa_private"
build_sources = [
	"rsa_private_wrapper.c",
	"bearssl-0.6/src/rsa/rsa_i31_priv.c",
	"bearssl-0.6/src/int/i31_add.c",
	"bearssl-0.6/src/int/i31_bitlen.c",
	"bearssl-0.6/src/int/i31_decode.c",
	"bearssl-0.6/src/int/i31_decred.c",
	"bearssl-0.6/src/int/i31_encode.c",
	"bearssl-0.6/src/int/i31_fmont.c",
	"bearssl-0.6/src/int/i31_modpow2.c",
	"bearssl-0.6/src/int/i31_montmul.c",
	"bearssl-0.6/src/int/i31_mulacc.c",
	"bearssl-0.6/src/int/i31_muladd.c",
	"bearssl-0.6/src/int/i31_ninv31.c",
	"bearssl-0.6/src/int/i31_reduce.c",
	"bearssl-0.6/src/int/i31_rshift.c",
	"bearssl-0.6/src/int/i31_sub.c",
	"bearssl-0.6/src/int/i31_tmont.c",
	"bearssl-0.6/src/codec/dec32be.c",
	"bearssl-0.6/src/codec/enc32be.c",
	"bearssl-0.6/src/codec/ccopy.c",
	"bearssl-0.6/src/int/i32_div32.c",
]
secret_layout = "dp:{sym_size},dq:{sym_size}"
secret_inputs = ["dp:{sym_size}:dp_buf", "dq:{sym_size}:dq_buf"]
public_layout = "ciphertext:128"
public_inputs = ["ciphertext:128:ciphertext_buf"]

