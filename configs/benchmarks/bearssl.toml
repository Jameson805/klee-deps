[[benchmarks]]
benchmark_id = "bearssl"
display_name = "BearSSL 0.6"
library_id = "bearssl"
code_path = "benchmarks/bearssl"
path_prefixes = ["benchmarks/bearssl/"]
tools = ["klee_cf", "klee_eager", "self_comp", "binsec", "abacus"]

[benchmarks.builds.abacus]
script = "benchmarks/bearssl/build.sh"
tool_flag = "--abacus"
preset = "default"

[benchmarks.builds.self_comp]
script = "benchmarks/bearssl/build.sh"
tool_flag = "--self-comp"
preset = "default"

[benchmarks.builds.binsec]
script = "benchmarks/bearssl/build.sh"
tool_flag = "--binsec"
preset = "default"

[benchmarks.builds.klee]
script = "benchmarks/bearssl/build.sh"
tool_flag = "--klee"
preset = "default"

[benchmarks.build_aliases]
klee_cf = "klee"
klee_eager = "klee"

[benchmarks.mode_case_templates]
abacus_executable = "benchmarks/bearssl/abacus_{public_mode}_{artifact_suffix}"
self_comp_bitcode = "benchmarks/bearssl/self_comp_{public_mode}_{artifact_suffix}.bc"
self_comp_replay_executable = "klee_{public_mode}_replay_{artifact_suffix}"
binsec_sse_script = "benchmarks/bearssl/generated/{artifact_suffix}/binsec_{public_mode}.cfg"
binsec_executable = "benchmarks/bearssl/binsec_{public_mode}_{artifact_suffix}"
klee_bitcode = "benchmarks/bearssl/klee_{public_mode}_{artifact_suffix}.bc"
klee_replay_script = "benchmarks/bearssl/klee_{public_mode}_replay_{artifact_suffix}"

[[benchmarks.mode_cases]]
display_name = "aes_big"
artifact_suffix = "binsec_aes_big"
output_stem = "bearssl_aes_big"
replay_opts = "--secret skey,data"
ct_json = "ctchecker_results/BearSSL0.6/empty.json"
memory_flag = true
secret_layout = "skey:48,data:32"
secret_inputs = ["skey:48:skey_buf", "data:32:data_buf"]
runner_config = "configs/runner/bearssl_aes_big_runner_config.toml"
preset_name = "default"

[[benchmarks.mode_cases]]
display_name = "des_tab"
artifact_suffix = "appliedcryp_des"
output_stem = "bearssl_des_tab"
replay_opts = "--secret skey,data"
ct_json = "ctchecker_results/BearSSL0.6/empty.json"
memory_flag = true
secret_layout = "skey:256,data:16"
secret_inputs = ["skey:256:skey_buf", "data:16:data_buf"]
runner_config = "configs/runner/bearssl_des_tab_runner_config.toml"
preset_name = "default"
