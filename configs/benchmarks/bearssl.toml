secret_layout = "dp:{sym_size},dq:{sym_size}"
secret_inputs = ["dp:{sym_size}:dp_buf", "dq:{sym_size}:dq_buf"]
public_layout = "ciphertext:128"
public_inputs = ["ciphertext:128:ciphertext_buf"]

