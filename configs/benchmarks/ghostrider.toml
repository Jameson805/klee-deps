[[benchmarks]]
library = "ghostrider"
code_path = "benchmarks/ghostrider"
path_prefixes = ["benchmarks/ghostrider/"]
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec", "abacus"]

[benchmarks.builds.abacus]
script = "benchmarks/ghostrider/build.sh"
tool_flag = "--abacus"
preset = "default"

[benchmarks.builds.binsec]
script = "benchmarks/ghostrider/build.sh"
tool_flag = "--binsec"
preset = "default"

[benchmarks.builds.klee]
script = "benchmarks/ghostrider/build.sh"
tool_flag = "--klee"
preset = "default"

[benchmarks.build_aliases]
klee_cf = "klee"
klee_eager = "klee"
klee_self_comp = "klee"

[benchmarks.runner_profiles.findmax]
config = "configs/runner/ghostrider_findmax_runner_config.toml"
preset = "default"

[benchmarks.runner_profiles.matmul]
config = "configs/runner/ghostrider_matmul_runner_config.toml"
preset = "default"

[benchmarks.path_templates]
abacus_executable = "{code_path}/abacus_{public_mode}_{artifact_suffix}"
binsec_sse_script = "{code_path}/generated/{artifact_suffix}/binsec_{public_mode}.cfg"
binsec_executable = "{code_path}/binsec_{public_mode}_{artifact_suffix}"
klee_bitcode = "{code_path}/klee_{public_mode}_{artifact_suffix}.bc"
klee_replay_script = "{code_path}/klee_{public_mode}_replay_{artifact_suffix}"

[benchmarks.variants.default]

[[benchmarks.targets]]
target = "findmax"
artifact_suffix = "findmax"
runner_profile = "findmax"
secret_layout = "data:2000"
secret_inputs = ["data:2000:data_buf"]
klee_secret_inputs = ["data"]

[[benchmarks.targets]]
target = "matmul"
artifact_suffix = "matmul"
runner_profile = "matmul"
secret_layout = "data:32768"
secret_inputs = ["data:32768:data_buf"]
klee_secret_inputs = ["data"]

[[benchmarks.configs]]
config = "fix_pub"
public_mode = "fix_pub"

[[benchmarks.configs]]
config = "var_pub"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec"]
