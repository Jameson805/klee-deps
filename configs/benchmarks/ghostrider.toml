[[benchmarks]]
benchmark_id = "ghostrider"
display_name = "ghostrider"
library_id = "unknown"
code_path = "benchmarks/ghostrider"
path_prefixes = ["benchmarks/ghostrider/"]
tools = ["klee_cf", "klee_eager", "self_comp", "binsec", "abacus"]

[benchmarks.builds.abacus]
script = "benchmarks/ghostrider/build.sh"
tool_flag = "--abacus"
preset = "default"

[benchmarks.builds.self_comp]
script = "benchmarks/ghostrider/build.sh"
tool_flag = "--self-comp"
preset = "default"

[benchmarks.builds.binsec]
script = "benchmarks/ghostrider/build.sh"
tool_flag = "--binsec"
preset = "default"

[benchmarks.builds.klee]
script = "benchmarks/ghostrider/build.sh"
tool_flag = "--klee"
preset = "default"

[benchmarks.build_aliases]
klee_cf = "klee"
klee_eager = "klee"

[[benchmarks.abacus_cases]]
executable = "benchmarks/ghostrider/abacus_fix_pub_findmax"
outfile = "ghostrider_findmax.txt"
runner_config = "configs/runner/ghostrider_findmax_runner_config.toml"
preset_name = "default"

[[benchmarks.abacus_cases]]
executable = "benchmarks/ghostrider/abacus_fix_pub_matmul"
outfile = "ghostrider_matmul.txt"
runner_config = "configs/runner/ghostrider_matmul_runner_config.toml"
preset_name = "default"

[[benchmarks.self_comp_cases]]
title = "Ghostrider findmax (Self-Comp)"
bitcode = "benchmarks/ghostrider/self_comp_fix_pub_findmax.bc"
result_name = "ghostrider_findmax_self_comp"
json_name = "ghostrider_findmax.json"
replay_executable = "klee_fix_pub_replay_findmax"
secret_layout = "data:2000"

[[benchmarks.self_comp_cases]]
title = "Ghostrider matmul (Self-Comp)"
bitcode = "benchmarks/ghostrider/self_comp_fix_pub_matmul.bc"
result_name = "ghostrider_matmul_self_comp"
json_name = "ghostrider_matmul.json"
replay_executable = "klee_fix_pub_replay_matmul"
secret_layout = "data:32768"

[[benchmarks.binsec_cases]]
title = "Ghostrider findmax"
sse_script = "benchmarks/ghostrider/generated/findmax/binsec_fix_pub.cfg"
stats_file = "ghostrider_findmax.toml"
executable = "benchmarks/ghostrider/binsec_fix_pub_findmax"
secret_inputs = ["data:2000:data_buf"]

[[benchmarks.binsec_cases]]
title = "Ghostrider matmul"
sse_script = "benchmarks/ghostrider/generated/matmul/binsec_fix_pub.cfg"
stats_file = "ghostrider_matmul.toml"
executable = "benchmarks/ghostrider/binsec_fix_pub_matmul"
secret_inputs = ["data:32768:data_buf"]

[[benchmarks.klee_cases]]
title = "Ghostrider findmax"
bitcode = "benchmarks/ghostrider/klee_fix_pub_findmax.bc"
result_name = "ghostrider_findmax"
replay_script = "benchmarks/ghostrider/klee_fix_pub_replay_findmax"
replay_opts = "--secret data"
ct_json = "ctchecker_results/OriginalBenchmarks/empty.json"
code_path = "benchmarks/ghostrider"
memory_flag = true


[[benchmarks.klee_cases]]
title = "Ghostrider matmul"
bitcode = "benchmarks/ghostrider/klee_fix_pub_matmul.bc"
result_name = "ghostrider_matmul"
replay_script = "benchmarks/ghostrider/klee_fix_pub_replay_matmul"
replay_opts = "--secret data"
ct_json = "ctchecker_results/OriginalBenchmarks/empty.json"
code_path = "benchmarks/ghostrider"
memory_flag = true