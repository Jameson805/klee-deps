[[benchmarks]]
library = "ghostrider"
code_path = "benchmarks/ghostrider"
path_prefixes = ["benchmarks/ghostrider/"]
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec", "abacus"]

[benchmarks.runner_profiles.findmax]
config = "configs/runner/ghostrider_findmax_runner_config.toml"
preset = "default"

[benchmarks.runner_profiles.matmul]
config = "configs/runner/ghostrider_matmul_runner_config.toml"
preset = "default"

[benchmarks.build]
preset = "default"
common_flags = ["-g", "-O0"]
include_dirs = ["{repo_root}/include"]

[benchmarks.build.tools.abacus]
concrete_pubs = true

[benchmarks.path_templates]
abacus_executable = "{code_path}/abacus_{public_mode}_{target}"
binsec_sse_script = "{code_path}/generated/{target}/binsec_{public_mode}.cfg"
binsec_executable = "{code_path}/binsec_{public_mode}_{target}"
klee_bitcode = "{code_path}/klee_{public_mode}_{target}.bc"
klee_replay_script = "{code_path}/klee_{public_mode}_replay_{target}"

[benchmarks.variants.default]

[[benchmarks.targets]]
target = "findmax"
runner_profile = "findmax"
build_sources = ["findmax_wrapper.c"]
secret_layout = "data:2000"
secret_inputs = ["data:2000:data_buf"]
klee_secret_inputs = ["data"]

[[benchmarks.targets]]
target = "matmul"
runner_profile = "matmul"
build_sources = ["matmul_wrapper.c"]
secret_layout = "data:32768"
secret_inputs = ["data:32768:data_buf"]
klee_secret_inputs = ["data"]

[[benchmarks.configs]]
config = "fix_pub"
public_mode = "fix_pub"

[[benchmarks.configs]]
config = "var_pub"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec"]
