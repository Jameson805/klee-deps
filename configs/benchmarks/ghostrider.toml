[[benchmarks]]
benchmark_id = "ghostrider"
display_name = "ghostrider"
library_id = "unknown"
code_path = "benchmarks/ghostrider"
path_prefixes = ["benchmarks/ghostrider/"]
tools = ["klee_cf", "klee_eager", "self_comp", "binsec", "abacus"]

[benchmarks.builds.abacus]
script = "benchmarks/ghostrider/build.sh"
tool_flag = "--abacus"
preset = "default"

[benchmarks.builds.self_comp]
script = "benchmarks/ghostrider/build.sh"
tool_flag = "--self-comp"
preset = "default"

[benchmarks.builds.binsec]
script = "benchmarks/ghostrider/build.sh"
tool_flag = "--binsec"
preset = "default"

[benchmarks.builds.klee]
script = "benchmarks/ghostrider/build.sh"
tool_flag = "--klee"
preset = "default"

[benchmarks.build_aliases]
klee_cf = "klee"
klee_eager = "klee"

[benchmarks.mode_case_templates]
abacus_executable = "benchmarks/ghostrider/abacus_{public_mode}_{artifact_suffix}"
self_comp_bitcode = "benchmarks/ghostrider/self_comp_{public_mode}_{artifact_suffix}.bc"
self_comp_replay_executable = "klee_{public_mode}_replay_{artifact_suffix}"
binsec_sse_script = "benchmarks/ghostrider/generated/{artifact_suffix}/binsec_{public_mode}.cfg"
binsec_executable = "benchmarks/ghostrider/binsec_{public_mode}_{artifact_suffix}"
klee_bitcode = "benchmarks/ghostrider/klee_{public_mode}_{artifact_suffix}.bc"
klee_replay_script = "benchmarks/ghostrider/klee_{public_mode}_replay_{artifact_suffix}"

[[benchmarks.mode_cases]]
display_name = "findmax"
artifact_suffix = "findmax"
output_stem = "ghostrider_findmax"
replay_opts = "--secret data"
ct_json = "ctchecker_results/OriginalBenchmarks/empty.json"
memory_flag = true
secret_layout = "data:2000"
secret_inputs = ["data:2000:data_buf"]
runner_config = "configs/runner/ghostrider_findmax_runner_config.toml"
preset_name = "default"

[[benchmarks.mode_cases]]
display_name = "matmul"
artifact_suffix = "matmul"
output_stem = "ghostrider_matmul"
replay_opts = "--secret data"
ct_json = "ctchecker_results/OriginalBenchmarks/empty.json"
memory_flag = true
secret_layout = "data:32768"
secret_inputs = ["data:32768:data_buf"]
runner_config = "configs/runner/ghostrider_matmul_runner_config.toml"
preset_name = "default"
