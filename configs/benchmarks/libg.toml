[[benchmarks]]
benchmark_id = "libg"
display_name = "libg"
library_id = "unknown"
code_path = "benchmarks/libg"
path_prefixes = ["benchmarks/libg/"]
tools = ["klee_cf", "klee_eager", "self_comp", "binsec", "abacus"]

[benchmarks.builds.abacus]
script = "benchmarks/libg/build.sh"
tool_flag = "--abacus"
preset = "default"

[benchmarks.builds.self_comp]
script = "benchmarks/libg/build.sh"
tool_flag = "--self-comp"
preset = "default"

[benchmarks.builds.binsec]
script = "benchmarks/libg/build.sh"
tool_flag = "--binsec"
preset = "default"

[benchmarks.builds.klee]
script = "benchmarks/libg/build.sh"
tool_flag = "--klee"
preset = "default"

[benchmarks.build_aliases]
klee_cf = "klee"
klee_eager = "klee"

[benchmarks.mode_case_templates]
abacus_executable = "benchmarks/libg/abacus_{public_mode}_{artifact_suffix}"
self_comp_bitcode = "benchmarks/libg/self_comp_{public_mode}_{artifact_suffix}.bc"
self_comp_replay_executable = "klee_{public_mode}_replay_{artifact_suffix}"
binsec_sse_script = "benchmarks/libg/generated/binsec_{public_mode}.cfg"
binsec_executable = "benchmarks/libg/binsec_{public_mode}_{artifact_suffix}"
klee_bitcode = "benchmarks/libg/klee_{public_mode}_{artifact_suffix}.bc"
klee_replay_script = "benchmarks/libg/klee_{public_mode}_replay_{artifact_suffix}"

[[benchmarks.mode_cases]]
display_name = "DES"
artifact_suffix = "des"
output_stem = "libg_des"
replay_opts = "--secret key,data"
ct_json = "ctchecker_results/OriginalBenchmarks/empty.json"
memory_flag = true
secret_layout = "key:24,data:64"
secret_inputs = ["key:24:key_buf", "data:64:data_buf"]
runner_config = "configs/runner/libg_des_runner_config.toml"
preset_name = "default"
