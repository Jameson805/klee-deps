[[benchmarks]]
library = "libg"
code_path = "benchmarks/libg"
path_prefixes = ["benchmarks/libg/"]
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec", "abacus"]

[benchmarks.builds.abacus]
script = "benchmarks/libg/build.sh"
tool_flag = "--abacus"
preset = "default"

[benchmarks.builds.binsec]
script = "benchmarks/libg/build.sh"
tool_flag = "--binsec"
preset = "default"

[benchmarks.builds.klee]
script = "benchmarks/libg/build.sh"
tool_flag = "--klee"
preset = "default"

[benchmarks.build_aliases]
klee_cf = "klee"
klee_eager = "klee"
klee_self_comp = "klee"

[benchmarks.runner_profiles.default]
config = "configs/runner/libg_des_runner_config.toml"
preset = "default"

[benchmarks.path_templates]
abacus_executable = "{code_path}/abacus_{public_mode}_{artifact_suffix}"
binsec_sse_script = "{code_path}/generated/{artifact_suffix}/binsec_{public_mode}.cfg"
binsec_executable = "{code_path}/binsec_{public_mode}_{artifact_suffix}"
klee_bitcode = "{code_path}/klee_{public_mode}_{artifact_suffix}.bc"
klee_replay_script = "{code_path}/klee_{public_mode}_replay_{artifact_suffix}"

[benchmarks.variants.default]

[[benchmarks.targets]]
target = "des"
artifact_suffix = "des"
runner_profile = "default"
secret_layout = "key:24,data:64"
secret_inputs = ["key:24:key_buf", "data:64:data_buf"]
klee_secret_inputs = ["key", "data"]

[[benchmarks.configs]]
config = "fix_pub"
public_mode = "fix_pub"

[[benchmarks.configs]]
config = "var_pub"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec"]
