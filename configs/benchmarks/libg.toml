[[benchmarks]]
library = "libg"
code_path = "benchmarks/libg"
path_prefixes = ["benchmarks/libg/"]
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec", "abacus"]

[benchmarks.runner_profiles.default]
config = "configs/runner/libg_des_runner_config.toml"
preset = "default"

[benchmarks.build]
preset = "default"
common_flags = ["-g", "-O0", "-std=gnu89"]
include_dirs = ["{repo_root}/include"]

[benchmarks.build.tools.abacus]
concrete_pubs = true

[benchmarks.path_templates]
abacus_executable = "{code_path}/artifacts/abacus/{target_output}/{public_mode}"
binsec_sse_script = "{code_path}/generated/{target_output}/binsec_{public_mode}.cfg"
binsec_executable = "{code_path}/artifacts/binsec/{target_output}/{public_mode}"
klee_bitcode = "{code_path}/artifacts/klee/{target_output}/{config}.bc"
klee_replay_script = "{code_path}/artifacts/klee/{target_output}/{public_mode}_replay"

[benchmarks.variants.default]

[[benchmarks.targets]]
target = "des"
runner_profile = "default"
build_sources = ["des_wrapper.c"]
secret_layout = "key:24,data:64"
secret_inputs = ["key:24:key_buf", "data:64:data_buf"]
klee_secret_inputs = ["key", "data"]

[[benchmarks.configs]]
config = "fix_pub"
public_mode = "fix_pub"

[[benchmarks.configs]]
config = "var_pub"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec"]
