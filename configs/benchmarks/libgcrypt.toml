[[benchmarks]]
benchmark_id = "libgcrypt"
display_name = "Libgcrypt 1.10.1"
library_id = "libgcrypt"
code_path = "benchmarks/libgcrypt-and-libgpg-error"
path_prefixes = ["benchmarks/libgcrypt-and-libgpg-error/"]
tools = ["klee_cf", "klee_eager", "self_comp", "binsec", "abacus"]

[benchmarks.builds.abacus]
script = "benchmarks/libgcrypt-and-libgpg-error/build.sh"
tool_flag = "--abacus"
preset = "size_{sym_size}"

[benchmarks.builds.self_comp]
script = "benchmarks/libgcrypt-and-libgpg-error/build.sh"
tool_flag = "--self-comp"
preset = "size_{sym_size}"

[benchmarks.builds.binsec]
script = "benchmarks/libgcrypt-and-libgpg-error/build.sh"
tool_flag = "--binsec"
preset = "size_{sym_size}"

[benchmarks.builds.klee]
script = "benchmarks/libgcrypt-and-libgpg-error/build.sh"
tool_flag = "--klee"
preset = "size_{sym_size}"

[benchmarks.build_aliases]
klee_cf = "klee"
klee_eager = "klee"

[[benchmarks.abacus_cases]]
executable = "benchmarks/libgcrypt-and-libgpg-error/abacus_fix_pub"
outfile = "libgcrypt.txt"

[[benchmarks.self_comp_cases]]
title = "Libgcrypt 1.10.1 (Fix Pub Self-Comp)"
bitcode = "benchmarks/libgcrypt-and-libgpg-error/self_comp_fix_pub.bc"
result_name = "libgcrypt_self_comp_fix_pub"
json_name = "libgcrypt_fix_pub.json"
replay_executable = "klee_fix_pub_replay"

[[benchmarks.self_comp_cases]]
title = "Libgcrypt 1.10.1 (Var Pub Self-Comp)"
bitcode = "benchmarks/libgcrypt-and-libgpg-error/self_comp_var_pub.bc"
result_name = "libgcrypt_self_comp_var_pub"
json_name = "libgcrypt_var_pub.json"
replay_executable = "klee_var_pub_replay"

[[benchmarks.binsec_cases]]
title = "Libgcrypt 1.10.1 (Fix Pub)"
sse_script = "benchmarks/libgcrypt-and-libgpg-error/generated/binsec_fix_pub.cfg"
stats_file = "libgcrypt_fix_pub.toml"
executable = "benchmarks/libgcrypt-and-libgpg-error/binsec_fix_pub"

[[benchmarks.binsec_cases]]
title = "Libgcrypt 1.10.1 (Var Pub)"
sse_script = "benchmarks/libgcrypt-and-libgpg-error/generated/binsec_var_pub.cfg"
stats_file = "libgcrypt_var_pub.toml"
executable = "benchmarks/libgcrypt-and-libgpg-error/binsec_var_pub"

[[benchmarks.klee_preprocess_steps]]
arguments = ["-blacklist=buf_nonzero,buf_bitlen,__builtin_clzl,__builtin_clz,__builtin_ctzl,__builtin_ctz,_gcry_mpih_lshift", "-o", "benchmarks/libgcrypt-and-libgpg-error/klee_fix_pub_lim_loop.bc", "benchmarks/libgcrypt-and-libgpg-error/klee_fix_pub.bc"]

[[benchmarks.klee_preprocess_steps]]
arguments = ["-blacklist=buf_nonzero,buf_bitlen,__builtin_clzl,__builtin_clz,__builtin_ctzl,__builtin_ctz,_gcry_mpih_lshift", "-o", "benchmarks/libgcrypt-and-libgpg-error/klee_var_pub_lim_loop.bc", "benchmarks/libgcrypt-and-libgpg-error/klee_var_pub.bc"]

[[benchmarks.klee_preprocess_steps]]
arguments = ["-blacklist=buf_nonzero,buf_bitlen", "-break", "-o", "benchmarks/libgcrypt-and-libgpg-error/klee_fix_pub_lim_loop_break.bc", "benchmarks/libgcrypt-and-libgpg-error/klee_fix_pub.bc"]

[[benchmarks.klee_preprocess_steps]]
arguments = ["-blacklist=buf_nonzero,buf_bitlen", "-break", "-o", "benchmarks/libgcrypt-and-libgpg-error/klee_var_pub_lim_loop_break.bc", "benchmarks/libgcrypt-and-libgpg-error/klee_var_pub.bc"]

[[benchmarks.klee_cases]]
title = "Libgcrypt 1.10.1 (Fix Pub)"
bitcode = "benchmarks/libgcrypt-and-libgpg-error/klee_fix_pub.bc"
result_name = "libgcrypt_fix_pub"
replay_script = "benchmarks/libgcrypt-and-libgpg-error/klee_fix_pub_replay"
replay_opts = "--secret exp"
ct_json = "ctchecker_results/libgcrypt1.10.1/3.json"
code_path = "benchmarks/libgcrypt-and-libgpg-error/libgcrypt-1.10.1/mpi"
memory_flag = false
mod_exp_extra_args = ["--filename", "mpi-pow.c", "--lines", "404:771"]

[[benchmarks.klee_cases]]
title = "Libgcrypt 1.10.1 (Var Pub)"
bitcode = "benchmarks/libgcrypt-and-libgpg-error/klee_var_pub.bc"
result_name = "libgcrypt_var_pub"
replay_script = "benchmarks/libgcrypt-and-libgpg-error/klee_var_pub_replay"
replay_opts = "--secret exp --public base,mod"
ct_json = "ctchecker_results/libgcrypt1.10.1/3.json"
code_path = "benchmarks/libgcrypt-and-libgpg-error/libgcrypt-1.10.1/mpi"
memory_flag = false
mod_exp_extra_args = ["--filename", "mpi-pow.c", "--lines", "404:771"]

[[benchmarks.klee_cases]]
title = "Libgcrypt 1.10.1 (Var Pub Lim Loop Break)"
bitcode = "benchmarks/libgcrypt-and-libgpg-error/klee_var_pub_lim_loop_break.bc"
result_name = "libgcrypt_var_pub_lim_loop_break"
replay_script = "benchmarks/libgcrypt-and-libgpg-error/klee_var_pub_replay"
replay_opts = "--secret exp --public base,mod"
ct_json = "ctchecker_results/libgcrypt1.10.1/3.json"
code_path = "benchmarks/libgcrypt-and-libgpg-error/libgcrypt-1.10.1/mpi"
memory_flag = false
mod_exp_extra_args = ["--filename", "mpi-pow.c", "--lines", "404:771"]

