[[benchmarks]]
library = "libgcrypt"
code_path = "benchmarks/libgcrypt-and-libgpg-error"
path_prefixes = ["benchmarks/libgcrypt-and-libgpg-error/"]
tools = ["klee_cf", "klee_eager", "self_comp", "binsec", "abacus"]

[benchmarks.builds.abacus]
script = "benchmarks/libgcrypt-and-libgpg-error/build.sh"
tool_flag = "--abacus"
preset = "size_{sym_size}"

[benchmarks.builds.self_comp]
script = "benchmarks/libgcrypt-and-libgpg-error/build.sh"
tool_flag = "--self-comp"
preset = "size_{sym_size}"

[benchmarks.builds.binsec]
script = "benchmarks/libgcrypt-and-libgpg-error/build.sh"
tool_flag = "--binsec"
preset = "size_{sym_size}"

[benchmarks.builds.klee]
script = "benchmarks/libgcrypt-and-libgpg-error/build.sh"
tool_flag = "--klee"
preset = "size_{sym_size}"

[benchmarks.build_aliases]
klee_cf = "klee"
klee_eager = "klee"

[benchmarks.runner_profiles.default]
config = "configs/runner/modexp_runner_config.toml"
preset = "size_{sym_size}"

[benchmarks.path_templates]
abacus_executable = "{code_path}/abacus_{public_mode}_modexp"

[benchmarks.tool_defaults.klee]
code_path = "benchmarks/libgcrypt-and-libgpg-error/libgcrypt-1.10.1/mpi"
secret_inputs = ["exp"]
public_inputs = ["base", "mod"]
mod_exp_extra_args = ["--filename", "mpi-pow.c", "--lines", "404:771"]

[[benchmarks.klee_preprocess_steps]]
arguments = ["-o", "benchmarks/libgcrypt-and-libgpg-error/klee_fix_pub_lim_loop.bc", "benchmarks/libgcrypt-and-libgpg-error/klee_fix_pub.bc"]

[[benchmarks.klee_preprocess_steps]]
arguments = ["-o", "benchmarks/libgcrypt-and-libgpg-error/klee_var_pub_lim_loop.bc", "benchmarks/libgcrypt-and-libgpg-error/klee_var_pub.bc"]

[[benchmarks.klee_preprocess_steps]]
arguments = ["-break", "-o", "benchmarks/libgcrypt-and-libgpg-error/klee_fix_pub_lim_loop_break.bc", "benchmarks/libgcrypt-and-libgpg-error/klee_fix_pub.bc"]

[[benchmarks.klee_preprocess_steps]]
arguments = ["-break", "-o", "benchmarks/libgcrypt-and-libgpg-error/klee_var_pub_lim_loop_break.bc", "benchmarks/libgcrypt-and-libgpg-error/klee_var_pub.bc"]

[benchmarks.variants.default]

[[benchmarks.configs]]
config = "fix_pub"
public_mode = "fix_pub"
runner_profile = "default"

[[benchmarks.configs]]
config = "var_pub"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager", "self_comp", "binsec"]
use_public_inputs = true

[[benchmarks.configs]]
config = "var_pub_lim_loop_break"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager"]
use_public_inputs = true

[benchmarks.variants.sliced]
tools = ["klee_cf"]
build_extra_args = ["--sliced"]

[benchmarks.variants.sliced.tool_defaults.klee]
code_path = "benchmarks/libgcrypt-and-libgpg-error/libgcrypt-1.10.1-sliced/mpi"
secret_inputs = ["exp"]
public_inputs = ["base", "mod"]
mod_exp_extra_args = ["--filename", "mpi-pow.c", "--lines", "404:771"]

[[benchmarks.variants.sliced.configs]]
config = "fix_pub"
public_mode = "fix_pub"

[[benchmarks.variants.sliced.configs]]
config = "var_pub"
public_mode = "var_pub"
use_public_inputs = true

[[benchmarks.variants.sliced.configs]]
config = "var_pub_lim_loop_break"
public_mode = "var_pub"
use_public_inputs = true
