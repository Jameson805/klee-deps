[[benchmarks]]
library = "libgcrypt"
code_path = "benchmarks/libgcrypt-and-libgpg-error"
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec", "abacus"]

[benchmarks.runner_profiles.default]
config = "configs/runner/modexp_runner_config.toml"
preset = "size_{sym_size}"

[benchmarks.build]
preset = "size_{sym_size}"
common_flags = ["-g", "-O0"]
include_dirs = ["{repo_root}/include", "generated/{target_output}", "{code_path}/build/include"]
link_libraries = ["{code_path}/build/lib/libgcrypt.a", "{code_path}/build/lib/libgpg-error.a"]
variables = { libgcrypt_host = "", libgcrypt_dir = "libgcrypt-1.10.1" }
prepare_commands = ["mkdir -p generated/modexp"]
build_dep_commands = [
	"cd libgpg-error-1.44 && ./configure CC={cc} CFLAGS=\"{dep_cflags}\" LDFLAGS=\"{dep_ldflags}\" --enable-static --disable-shared --disable-doc --prefix=\"{install_root}\" {libgcrypt_host} && make clean && make -j{make_jobs} && make install",
	"cd {libgcrypt_dir} && ./configure CC={cc} CFLAGS=\"{dep_cflags} -DNO_ASM\" LDFLAGS=\"{dep_ldflags}\" --enable-static --disable-shared --disable-asm --disable-doc --with-libgpg-error-prefix=\"{install_root}\" --with-sysroot=\"{install_root}\" --prefix=\"{install_root}\" {libgcrypt_host} && make clean && make -j{make_jobs} && make install",
]

[benchmarks.build.tools.abacus]
concrete_pubs = false
variables = { libgcrypt_host = "--host=i686-pc-linux-gnu" }

[benchmarks.tool_defaults.klee]
code_path = "benchmarks/libgcrypt-and-libgpg-error/libgcrypt-1.10.1/mpi"
secret_inputs = ["exp"]
public_inputs = ["base", "mod"]
mod_exp_extra_args = ["--filename", "mpi-pow.c", "--lines", "404:771"]

[benchmarks.tool_defaults.klee.preprocess_profiles.lim_loop_break]
arguments = ["-break", "-o", "{output}", "{input}"]

[benchmarks.variants.default]

[[benchmarks.targets]]
target = "modexp"
runner_profile = "default"
build_sources = ["modexp_wrapper.c"]

[[benchmarks.configs]]
config = "fix_pub"
public_mode = "fix_pub"
runner_profile = "default"

[[benchmarks.configs]]
config = "var_pub"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec"]
use_public_inputs = true

[[benchmarks.configs]]
config = "var_pub_lim_loop_break"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager"]
preprocess = "lim_loop_break"
use_public_inputs = true

[benchmarks.variants.sliced]
tools = ["klee_cf"]

[benchmarks.variants.sliced.build]
preset = "size_{sym_size}"
common_flags = ["-g", "-O0"]
include_dirs = ["{repo_root}/include", "generated/{target_output}", "{code_path}/build/include"]
link_libraries = ["{code_path}/build/lib/libgcrypt.a", "{code_path}/build/lib/libgpg-error.a"]
variables = { libgcrypt_host = "", libgcrypt_dir = "libgcrypt-1.10.1-sliced" }
prepare_commands = ["mkdir -p generated/modexp_sliced"]
build_dep_commands = [
	"cd libgpg-error-1.44 && ./configure CC={cc} CFLAGS=\"{dep_cflags}\" LDFLAGS=\"{dep_ldflags}\" --enable-static --disable-shared --disable-doc --prefix=\"{install_root}\" {libgcrypt_host} && make clean && make -j{make_jobs} && make install",
	"cd libgcrypt-1.10.1-sliced && ./configure CC={cc} CFLAGS=\"{dep_cflags} -DNO_ASM\" LDFLAGS=\"{dep_ldflags}\" --enable-static --disable-shared --disable-asm --disable-doc --with-libgpg-error-prefix=\"{install_root}\" --with-sysroot=\"{install_root}\" --prefix=\"{install_root}\" {libgcrypt_host} && make clean && make -j{make_jobs} && make install",
]

[benchmarks.variants.sliced.build.tools.abacus]
concrete_pubs = false
variables = { libgcrypt_host = "--host=i686-pc-linux-gnu" }

[benchmarks.variants.sliced.tool_defaults.klee]
code_path = "benchmarks/libgcrypt-and-libgpg-error/libgcrypt-1.10.1-sliced/mpi"
secret_inputs = ["exp"]
public_inputs = ["base", "mod"]
mod_exp_extra_args = ["--filename", "mpi-pow.c", "--lines", "404:771"]

[benchmarks.variants.sliced.tool_defaults.klee.preprocess_profiles.lim_loop_break]
arguments = ["-break", "-o", "{output}", "{input}"]

[[benchmarks.variants.sliced.targets]]
target = "modexp"
runner_profile = "default"
build_sources = ["modexp_wrapper.c", "powm_sliced.c"]
defines = ["USE_SLICED"]

[[benchmarks.variants.sliced.configs]]
config = "fix_pub"
public_mode = "fix_pub"

[[benchmarks.variants.sliced.configs]]
config = "var_pub"
public_mode = "var_pub"
use_public_inputs = true

[[benchmarks.variants.sliced.configs]]
config = "var_pub_lim_loop_break"
public_mode = "var_pub"
preprocess = "lim_loop_break"
use_public_inputs = true
