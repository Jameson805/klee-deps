[[benchmarks]]
library = "libsodium"
code_path = "benchmarks/libsodium"
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec", "abacus"]

[benchmarks.runner_profiles.default]
config = "configs/runner/libsodium_curve25519_runner_config.toml"
preset = "default"

[benchmarks.runner_profiles.stream]
config = "configs/runner/libsodium_stream_runner_config.toml"
preset = "default"

[benchmarks.runner_profiles.hash]
config = "configs/runner/libsodium_hash_runner_config.toml"
preset = "default"

[benchmarks.build]
preset = "default"
common_flags = ["-g", "-O0"]
include_dirs = ["{repo_root}/include", "{code_path}/build/install/include"]
link_libraries = ["{code_path}/build/install/lib/libsodium.a"]
build_dep_commands = [
  "rm -rf build",
  "mkdir -p build",
  "cd libsodium-stable && ./autogen.sh -s",
  "cd build && ../libsodium-stable/configure --disable-shared --enable-static --disable-asm --prefix=\"$(pwd)/install\" CC={cc} CFLAGS=\"{dep_cflags}\" LDFLAGS=\"{dep_ldflags}\"",
  "cd build && make -j {make_jobs}",
  "cd build && make install",
]

[benchmarks.build.tools.abacus]
concrete_pubs = true

[benchmarks.variants.curve25519]

# Keep the selector explicit so campaigns do not silently widen if new
# libsodium targets are added later.
[[benchmarks.variants.curve25519.targets]]
target = "curve25519_scalarmult"
runner_profile = "default"
build_sources = ["curve25519_scalarmult_wrapper.c"]
secret_layout = "scalar:32"
secret_inputs = ["scalar:32:scalar_buf"]
public_layout = "point:32"
public_inputs = ["point:32:point_buf"]
klee_secret_inputs = ["scalar"]
klee_public_inputs = ["point"]

[[benchmarks.variants.curve25519.configs]]
config = "fix_pub"
public_mode = "fix_pub"
runner_profile = "default"

[[benchmarks.variants.curve25519.configs]]
config = "var_pub"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec"]
use_public_inputs = true

[benchmarks.variants.salsa20]

[[benchmarks.variants.salsa20.targets]]
target = "salsa20"
runner_profile = "stream"
build_sources = ["salsa20_wrapper.c"]
secret_layout = "key:32"
secret_inputs = ["key:32:key_buf"]
public_layout = "nonce:8,message:256"
public_inputs = ["nonce:8:nonce_buf", "message:256:message_buf"]
klee_secret_inputs = ["key"]
klee_public_inputs = ["nonce", "message"]

[[benchmarks.variants.salsa20.configs]]
config = "fix_pub"
public_mode = "fix_pub"
runner_profile = "stream"

[[benchmarks.variants.salsa20.configs]]
config = "var_pub"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec"]
use_public_inputs = true
runner_profile = "stream"

[benchmarks.variants.chacha20]

[[benchmarks.variants.chacha20.targets]]
target = "chacha20"
runner_profile = "stream"
build_sources = ["chacha20_wrapper.c"]
secret_layout = "key:32"
secret_inputs = ["key:32:key_buf"]
public_layout = "nonce:8,message:256"
public_inputs = ["nonce:8:nonce_buf", "message:256:message_buf"]
klee_secret_inputs = ["key"]
klee_public_inputs = ["nonce", "message"]

[[benchmarks.variants.chacha20.configs]]
config = "fix_pub"
public_mode = "fix_pub"
runner_profile = "stream"

[[benchmarks.variants.chacha20.configs]]
config = "var_pub"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec"]
use_public_inputs = true
runner_profile = "stream"

[benchmarks.variants.sha256]

[[benchmarks.variants.sha256.targets]]
target = "sha256"
runner_profile = "hash"
build_sources = ["sha256_wrapper.c"]
secret_layout = "message:256"
secret_inputs = ["message:256:message_buf"]
klee_secret_inputs = ["message"]

[[benchmarks.variants.sha256.configs]]
config = "fix_pub"
public_mode = "fix_pub"
runner_profile = "hash"

[benchmarks.variants.sha512]

[[benchmarks.variants.sha512.targets]]
target = "sha512"
runner_profile = "hash"
build_sources = ["sha512_wrapper.c"]
secret_layout = "message:256"
secret_inputs = ["message:256:message_buf"]
klee_secret_inputs = ["message"]

[[benchmarks.variants.sha512.configs]]
config = "fix_pub"
public_mode = "fix_pub"
runner_profile = "hash"
