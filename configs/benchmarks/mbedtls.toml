[[benchmarks]]
library = "mbedtls"
code_path = "benchmarks/mbedtls-3.2.1"
path_prefixes = ["benchmarks/mbedtls-3.2.1/"]
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec", "abacus"]

[benchmarks.builds.abacus]
script = "benchmarks/mbedtls-3.2.1/build.sh"
tool_flag = "--abacus"
preset = "size_{sym_size}"

[benchmarks.builds.binsec]
script = "benchmarks/mbedtls-3.2.1/build.sh"
tool_flag = "--binsec"
preset = "size_{sym_size}"

[benchmarks.builds.klee]
script = "benchmarks/mbedtls-3.2.1/build.sh"
tool_flag = "--klee"
preset = "size_{sym_size}"

[benchmarks.build_aliases]
klee_cf = "klee"
klee_eager = "klee"
klee_self_comp = "klee"

[benchmarks.runner_profiles.default]
config = "configs/runner/modexp_runner_config.toml"
preset = "size_{sym_size}"

[benchmarks.path_templates]
abacus_executable = "{code_path}/abacus_{public_mode}_modexp"

[benchmarks.tool_defaults.klee]
code_path = "mbedtls-3.2.1"
secret_inputs = ["exp"]
public_inputs = ["base", "mod"]
extra_args = ["--ctchecker-prefix", "library"]
mod_exp_extra_args = ["--filename", "bignum.c", "--lines", "1968:2202"]

[[benchmarks.klee_preprocess_steps]]
arguments = ["-o", "benchmarks/mbedtls-3.2.1/klee_fix_pub_lim_loop.bc", "benchmarks/mbedtls-3.2.1/klee_fix_pub.bc"]

[[benchmarks.klee_preprocess_steps]]
arguments = ["-break", "-o", "benchmarks/mbedtls-3.2.1/klee_fix_pub_lim_loop_break.bc", "benchmarks/mbedtls-3.2.1/klee_fix_pub.bc"]

[[benchmarks.klee_preprocess_steps]]
arguments = ["-o", "benchmarks/mbedtls-3.2.1/klee_var_pub_lim_loop.bc", "benchmarks/mbedtls-3.2.1/klee_var_pub.bc"]

[[benchmarks.klee_preprocess_steps]]
arguments = ["-break", "-o", "benchmarks/mbedtls-3.2.1/klee_var_pub_lim_loop_break.bc", "benchmarks/mbedtls-3.2.1/klee_var_pub.bc"]

[benchmarks.variants.default]

[[benchmarks.configs]]
config = "fix_pub"
public_mode = "fix_pub"
runner_profile = "default"

[[benchmarks.configs]]
config = "var_pub"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec"]
use_public_inputs = true

[[benchmarks.configs]]
config = "var_pub_lim_loop_break"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager"]
use_public_inputs = true

[benchmarks.variants.sliced]
tools = ["klee_cf"]

[benchmarks.variants.sliced.tool_defaults.klee]
code_path = "mbedtls-3.2.1"
secret_inputs = ["exp"]
public_inputs = ["base", "mod"]
extra_args = ["--ctchecker-prefix", "library"]
mod_exp_extra_args = ["--filename", "bignum.c", "--lines", "1968:2202"]

[benchmarks.variants.sliced.path_templates]
klee_bitcode = "{code_path}/klee_{config}_sliced.bc"
klee_replay_script = "{code_path}/klee_{public_mode}_replay_sliced"

[[benchmarks.variants.sliced.configs]]
config = "fix_pub"
public_mode = "fix_pub"

[[benchmarks.variants.sliced.configs]]
config = "var_pub"
public_mode = "var_pub"
use_public_inputs = true

[[benchmarks.variants.sliced.configs]]
config = "var_pub_lim_loop_break"
public_mode = "var_pub"
use_public_inputs = true
