[[benchmarks.variants.rsa_stages.configs]]
config = "fix_pub"
public_mode = "fix_pub"

[[benchmarks.variants.rsa_stages.configs]]
config = "var_pub"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager", "binsec"]
