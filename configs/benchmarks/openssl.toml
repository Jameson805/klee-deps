[[benchmarks]]
library = "openssl"
code_path = "benchmarks/openssl-1.1.1q"
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec", "abacus"]
[benchmarks.build]
preset = "size_{sym_size}"
common_flags = ["-g", "-O0"]
include_dirs = ["{repo_root}/include", "include"]
link_libraries = ["libcrypto.a"]
variables = { openssl_arch = "linux-generic64" }
prepare_commands = ["cp -f crypto/bn/bn_exp_orig.c crypto/bn/bn_exp.c"]
build_dep_commands = [
	"env CC={cc} CFLAGS= CPPFLAGS= CXXFLAGS= LDFLAGS= ./Configure --debug no-shared no-asm no-tests no-threads -DOPENSSL_AES_CONST_TIME {openssl_arch}",
	"make clean",
	"make CC={cc} CFLAGS=\"{dep_cflags}\" LDFLAGS=\"{dep_ldflags}\" -j{make_jobs}",
]

[benchmarks.build.tools.abacus]
link_flags = ["-pthread", "-ldl"]
concrete_pubs = false
variables = { openssl_arch = "linux-generic32" }

[benchmarks.runner_profiles.default]
config = "configs/runner/modexp_runner_config.toml"
preset = "size_{sym_size}"

[benchmarks.runner_profiles.rsa_private]
config = "configs/runner/openssl_rsa_private_runner_config.toml"
preset = "size_64"

[benchmarks.runner_profiles.rsa_padding]
config = "configs/runner/openssl_rsa_padding_runner_config.toml"
preset = "size_{sym_size}"

[benchmarks.runner_profiles.aes]
config = "configs/runner/openssl_symmetric_aes_runner_config.toml"
preset = "default"

[benchmarks.runner_profiles.des]
config = "configs/runner/openssl_symmetric_des_runner_config.toml"
preset = "default"

[benchmarks.runner_profiles.ecdsa]
config = "configs/runner/openssl_ecdsa_sign_runner_config.toml"
preset = "default"

[benchmarks.tool_defaults.klee]
code_path = "openssl-1.1.1q"
extra_args = ["--ctchecker-prefix", "crypto/bn"]
secret_inputs = ["exp"]
public_inputs = ["base", "mod"]

[benchmarks.tool_defaults.klee.preprocess_profiles.lim_loop]
arguments = ["-o", "{output}", "{input}"]

[benchmarks.tool_defaults.klee.preprocess_profiles.lim_loop_break]
arguments = ["-break", "-o", "{output}", "{input}"]

[benchmarks.variants.default]

[benchmarks.variants.sliced]
tools = ["klee_cf"]

[benchmarks.variants.rsa_stages.tool_defaults.klee]
code_path = "openssl-1.1.1q"
extra_args = ["--ctchecker-prefix", "crypto/rsa"]

[benchmarks.variants.aes_des.build]
preset = "default"
common_flags = ["-g", "-O0"]
include_dirs = ["{repo_root}/include", "include"]
link_libraries = ["libcrypto.a"]
variables = { openssl_arch = "linux-generic64" }
build_dep_commands = [
	"env CC={cc} CFLAGS= CPPFLAGS= CXXFLAGS= LDFLAGS= ./Configure --debug no-shared no-asm no-tests no-threads -DOPENSSL_AES_CONST_TIME {openssl_arch}",
	"make clean",
	"make CC={cc} CFLAGS=\"{dep_cflags}\" LDFLAGS=\"{dep_ldflags}\" -j{make_jobs}",
]

[benchmarks.variants.aes_des.build.tools.abacus]
link_flags = ["-pthread", "-ldl"]
concrete_pubs = true
variables = { openssl_arch = "linux-generic32" }

[benchmarks.variants.aes_des.tool_defaults.klee]
code_path = "openssl-1.1.1q"
extra_args = ["--ctchecker-prefix", "crypto"]
secret_inputs = ["key"]
public_inputs = ["data", "iv"]

[benchmarks.variants.ecdsa.build]
preset = "default"
common_flags = ["-g", "-O0"]
include_dirs = ["{repo_root}/include", "include"]
link_libraries = ["libcrypto.a"]
variables = { openssl_arch = "linux-generic64" }
build_dep_commands = [
	"env CC={cc} CFLAGS= CPPFLAGS= CXXFLAGS= LDFLAGS= ./Configure --debug no-shared no-asm no-tests no-threads -DOPENSSL_AES_CONST_TIME {openssl_arch}",
	"make clean",
	"make CC={cc} CFLAGS=\"{dep_cflags}\" LDFLAGS=\"{dep_ldflags}\" -j{make_jobs}",
]

[benchmarks.variants.ecdsa.build.tools.abacus]
link_flags = ["-pthread", "-ldl"]
concrete_pubs = true
variables = { openssl_arch = "linux-generic32" }

[benchmarks.variants.ecdsa.tool_defaults.klee]
code_path = "openssl-1.1.1q"
extra_args = ["--ctchecker-prefix", "crypto/ec"]
secret_inputs = ["private_key", "nonce"]
public_inputs = ["digest"]

[benchmarks.variants.sliced.build]
preset = "size_{sym_size}"
common_flags = ["-g", "-O0"]
include_dirs = ["{repo_root}/include", "include"]
link_libraries = ["libcrypto.a"]
variables = { openssl_arch = "linux-generic64" }
prepare_commands = ["cp -f crypto/bn/bn_exp_sliced.c crypto/bn/bn_exp.c"]
build_dep_commands = [
	"env CC={cc} CFLAGS= CPPFLAGS= CXXFLAGS= LDFLAGS= ./Configure --debug no-shared no-asm no-tests no-threads -DOPENSSL_AES_CONST_TIME {openssl_arch}",
	"make clean",
	"make CC={cc} CFLAGS=\"{dep_cflags}\" LDFLAGS=\"{dep_ldflags}\" -j{make_jobs}",
]

[benchmarks.variants.sliced.build.tools.abacus]
link_flags = ["-pthread", "-ldl"]
concrete_pubs = false
variables = { openssl_arch = "linux-generic32" }

[benchmarks.variants.sliced.tool_defaults.klee.preprocess_profiles.lim_loop]
arguments = ["-o", "{output}", "{input}"]

[benchmarks.variants.sliced.tool_defaults.klee.preprocess_profiles.lim_loop_break]
arguments = ["-break", "-o", "{output}", "{input}"]

[[benchmarks.targets]]
target = "recp"
runner_profile = "default"
secret_layout = "exp:{sym_size}"
secret_inputs = ["exp:{sym_size}:exp_buf"]
public_layout = "base:{sym_size},mod:{sym_size}"
public_inputs = ["base:{sym_size}:base_buf", "mod:{sym_size}:mod_buf"]
build_sources = ["modexp_wrapper.c"]
defines = ["RECP"]

[[benchmarks.targets]]
target = "mont"
runner_profile = "default"
secret_layout = "exp:{sym_size}"
secret_inputs = ["exp:{sym_size}:exp_buf"]
public_layout = "base:{sym_size},mod:{sym_size}"
public_inputs = ["base:{sym_size}:base_buf", "mod:{sym_size}:mod_buf"]
build_sources = ["modexp_wrapper.c"]
defines = ["MONT"]

[[benchmarks.targets]]
target = "mont_consttime"
runner_profile = "default"
secret_layout = "exp:{sym_size}"
secret_inputs = ["exp:{sym_size}:exp_buf"]
public_layout = "base:{sym_size},mod:{sym_size}"
public_inputs = ["base:{sym_size}:base_buf", "mod:{sym_size}:mod_buf"]
build_sources = ["modexp_wrapper.c"]
defines = ["MONT_CONSTTIME"]

[[benchmarks.targets]]
target = "mont_word"
runner_profile = "default"
secret_layout = "exp:{sym_size}"
secret_inputs = ["exp:{sym_size}:exp_buf"]
public_layout = "base:{sym_size},mod:{sym_size}"
public_inputs = ["base:{sym_size}:base_buf", "mod:{sym_size}:mod_buf"]
build_sources = ["modexp_wrapper.c"]
defines = ["MONT_WORD"]

[[benchmarks.configs]]
config = "fix_pub"
public_mode = "fix_pub"
runner_profile = "default"

[[benchmarks.configs]]
config = "var_pub"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec"]
use_public_inputs = true

[[benchmarks.configs]]
config = "var_pub_lim_loop_break"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager"]
preprocess = "lim_loop_break"
use_public_inputs = true

[[benchmarks.exclusions]]
variant = "sliced"
target = "mont_consttime"

[[benchmarks.variants.rsa_stages.targets]]
target = "rsa_private_core"
runner_profile = "rsa_private"
secret_layout = "dp:64,dq:64"
secret_inputs = ["dp:64:dp_buf", "dq:64:dq_buf"]
public_layout = "ciphertext:128"
public_inputs = ["ciphertext:128:ciphertext_buf"]
build_sources = ["rsa_private_core_wrapper.c"]

[[benchmarks.variants.rsa_stages.targets]]
target = "padding_check_pkcs1_type_2"
runner_profile = "rsa_padding"
secret_layout = "encoded:128"
secret_inputs = ["encoded:128:encoded_buf"]
build_sources = ["padding_check_wrapper.c"]
defines = ["OPENSSL_RSA_PADDING_CHECK_PKCS1_TYPE_2"]

[[benchmarks.variants.rsa_stages.targets]]
target = "padding_check_oaep_mgf1"
runner_profile = "rsa_padding"
secret_layout = "encoded:128"
secret_inputs = ["encoded:128:encoded_buf"]
build_sources = ["padding_check_wrapper.c"]
defines = ["OPENSSL_RSA_PADDING_CHECK_OAEP_MGF1"]

[[benchmarks.variants.rsa_stages.targets]]
target = "padding_check_sslv23"
runner_profile = "rsa_padding"
secret_layout = "encoded:128"
secret_inputs = ["encoded:128:encoded_buf"]
build_sources = ["padding_check_wrapper.c"]
defines = ["OPENSSL_RSA_PADDING_CHECK_SSLV23"]

[[benchmarks.variants.rsa_stages.targets]]
