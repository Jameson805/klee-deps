[[benchmarks]]
benchmark_id = "openssl"
display_name = "OpenSSL 1.1.1q"
library_id = "openssl"
code_path = "benchmarks/openssl-1.1.1q"
path_prefixes = ["benchmarks/openssl-1.1.1q/"]
tools = ["klee_cf", "klee_eager", "self_comp", "binsec", "abacus"]

[benchmarks.builds.abacus]
script = "benchmarks/openssl-1.1.1q/build.sh"
tool_flag = "--abacus"
preset = "size_{sym_size}"

[benchmarks.builds.self_comp]
script = "benchmarks/openssl-1.1.1q/build.sh"
tool_flag = "--self-comp"
preset = "size_{sym_size}"

[benchmarks.builds.binsec]
script = "benchmarks/openssl-1.1.1q/build.sh"
tool_flag = "--binsec"
preset = "size_{sym_size}"

[benchmarks.builds.klee]
script = "benchmarks/openssl-1.1.1q/build.sh"
tool_flag = "--klee"
preset = "size_{sym_size}"

[benchmarks.build_aliases]
klee_cf = "klee"
klee_eager = "klee"

