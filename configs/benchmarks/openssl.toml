[[benchmarks]]
library = "openssl"
code_path = "benchmarks/openssl-1.1.1q"
path_prefixes = ["benchmarks/openssl-1.1.1q/"]
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec", "abacus"]

[benchmarks.builds.abacus]
script = "benchmarks/openssl-1.1.1q/build.sh"
tool_flag = "--abacus"
preset = "size_{sym_size}"

[benchmarks.builds.binsec]
script = "benchmarks/openssl-1.1.1q/build.sh"
tool_flag = "--binsec"
preset = "size_{sym_size}"

[benchmarks.builds.klee]
script = "benchmarks/openssl-1.1.1q/build.sh"
tool_flag = "--klee"
preset = "size_{sym_size}"

[benchmarks.build_aliases]
klee_cf = "klee"
klee_eager = "klee"
klee_self_comp = "klee"

[benchmarks.runner_profiles.default]
config = "configs/runner/modexp_runner_config.toml"
preset = "size_{sym_size}"

[benchmarks.tool_defaults.klee]
code_path = "openssl-1.1.1q"
extra_args = ["--ctchecker-prefix", "crypto/bn"]
secret_inputs = ["exp"]
public_inputs = ["base", "mod"]

[benchmarks.preprocess_profiles.lim_loop]
arguments = ["-o", "{output}", "{input}"]

[benchmarks.preprocess_profiles.lim_loop_break]
arguments = ["-break", "-o", "{output}", "{input}"]

[benchmarks.variants.default]

[benchmarks.variants.sliced]
tools = ["klee_cf"]
build_extra_args = ["--sliced"]

[[benchmarks.targets]]
target = "recp"

[[benchmarks.targets]]
target = "mont"

[[benchmarks.targets]]
target = "mont_consttime"

[[benchmarks.targets]]
target = "mont_word"

[[benchmarks.configs]]
config = "fix_pub"
public_mode = "fix_pub"
runner_profile = "default"

[[benchmarks.configs]]
config = "var_pub"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec"]
use_public_inputs = true

[[benchmarks.configs]]
config = "var_pub_lim_loop_break"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager"]
preprocess = "lim_loop_break"
use_public_inputs = true

[[benchmarks.exclusions]]
variant = "sliced"
target = "mont_consttime"
