[[benchmarks]]
library = "openssl_almeida"
code_path = "benchmarks/openssl_almeida"
path_prefixes = ["benchmarks/openssl_almeida/"]
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec", "abacus"]

[benchmarks.builds.abacus]
script = "benchmarks/openssl_almeida/build.sh"
tool_flag = "--abacus"
preset = "default"

[benchmarks.builds.binsec]
script = "benchmarks/openssl_almeida/build.sh"
tool_flag = "--binsec"
preset = "default"

[benchmarks.builds.klee]
script = "benchmarks/openssl_almeida/build.sh"
tool_flag = "--klee"
preset = "default"

[benchmarks.build_aliases]
klee_cf = "klee"
klee_eager = "klee"
klee_self_comp = "klee"

[benchmarks.runner_profiles.default]
config = "configs/runner/openssl_almeida_tls_rempad_luk13_runner_config.toml"
preset = "default"

[benchmarks.variants.default]

[[benchmarks.targets]]
target = "tls_rempad_luk13"
runner_profile = "default"
secret_layout = "data:63"
secret_inputs = ["data:63:data_buf"]
klee_secret_inputs = ["data"]

[[benchmarks.configs]]
config = "fix_pub"
public_mode = "fix_pub"
runner_profile = "default"

[[benchmarks.configs]]
config = "var_pub"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec"]
use_public_inputs = true
public_layout = "options:4,s3_flags:4,flags:4,slicing_cheat:4,block_size:4,mac_size:4"
public_inputs = [
    "options:4:options_buf",
    "s3_flags:4:s3_flags_buf",
    "flags:4:flags_buf",
    "slicing_cheat:4:slicing_cheat_buf",
    "block_size:4:block_size_buf",
    "mac_size:4:mac_size_buf",
]
klee_public_inputs = ["options", "s3_flags", "flags", "slicing_cheat", "block_size", "mac_size"]
