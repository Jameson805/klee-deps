[[benchmarks]]
library = "pycrypto"
code_path = "benchmarks/pycrypto"
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec", "abacus"]

[benchmarks.runner_profiles]

[benchmarks.runner_profiles.default]
config = "configs/runner/pycrypto_arc4_runner_config.toml"
preset = "default"

[benchmarks.build]
preset = "default"
common_flags = ["-g", "-O0", "-std=gnu89"]
include_dirs = ["{repo_root}/include"]

[benchmarks.build.tools]

[benchmarks.build.tools.abacus]
common_flags = ["-std=gnu99"]
concrete_pubs = true

[[benchmarks.configs]]
config = "fix_pub"
public_mode = "fix_pub"

[[benchmarks.configs]]
config = "var_pub"
public_mode = "var_pub"
tools = ["klee_cf", "klee_eager", "klee_self_comp", "binsec"]

[benchmarks.targets.arc4]
runner_profile = "default"
build_sources = ["arc4_wrapper.c"]
secret_layout = "key:32"
secret_inputs = ["key:32:key_buf"]
klee_secret_inputs = ["key"]
