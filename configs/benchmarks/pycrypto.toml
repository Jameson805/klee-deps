[[benchmarks]]
benchmark_id = "pycrypto"
display_name = "PyCrypto"
library_id = "unknown"
code_path = "benchmarks/pycrypto"
path_prefixes = ["benchmarks/pycrypto/"]
tools = ["klee_cf", "klee_eager", "self_comp", "binsec", "abacus"]

[benchmarks.builds.abacus]
script = "benchmarks/pycrypto/build.sh"
tool_flag = "--abacus"
preset = "default"

[benchmarks.builds.self_comp]
script = "benchmarks/pycrypto/build.sh"
tool_flag = "--self-comp"
preset = "default"

[benchmarks.builds.binsec]
script = "benchmarks/pycrypto/build.sh"
tool_flag = "--binsec"
preset = "default"

[benchmarks.builds.klee]
script = "benchmarks/pycrypto/build.sh"
tool_flag = "--klee"
preset = "default"

[benchmarks.build_aliases]
klee_cf = "klee"
klee_eager = "klee"

[benchmarks.mode_case_templates]
abacus_executable = "benchmarks/pycrypto/abacus_{public_mode}_{artifact_suffix}"
self_comp_bitcode = "benchmarks/pycrypto/self_comp_{public_mode}_{artifact_suffix}.bc"
self_comp_replay_executable = "klee_{public_mode}_replay_{artifact_suffix}"
binsec_sse_script = "benchmarks/pycrypto/generated/binsec_{public_mode}.cfg"
binsec_executable = "benchmarks/pycrypto/binsec_{public_mode}_{artifact_suffix}"
klee_bitcode = "benchmarks/pycrypto/klee_{public_mode}_{artifact_suffix}.bc"
klee_replay_script = "benchmarks/pycrypto/klee_{public_mode}_replay_{artifact_suffix}"

[[benchmarks.mode_cases]]
display_name = "ARC4"
artifact_suffix = "arc4"
output_stem = "pycrypto_arc4"
replay_opts = "--secret key"
ct_json = "ctchecker_results/OriginalBenchmarks/empty.json"
memory_flag = true
secret_layout = "key:32"
secret_inputs = ["key:32:key_buf"]
runner_config = "configs/runner/pycrypto_arc4_runner_config.toml"
preset_name = "default"
