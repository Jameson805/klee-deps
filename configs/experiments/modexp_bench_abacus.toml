[campaign]
# Used for direct runs without --docker. Docker mode builds from the
# CLI-provided ABACUS repo path and uses --container-abacus-root inside the
# container.
abacus_root = "/datapool/theta-lin/Abacus"
num_copies = 1
tmp_dir = "/datapool/theta-lin-experiments/tmp"
output = "/datapool/theta-lin-experiments/20260616_modexp_bench_abacus"
# Modexp descriptors use size-templated ABACUS build and runner presets.
sym_sizes = [4, 16]

[benchmarks]
abacus = [
  "bearssl:modexp",
  "libgcrypt:modexp",
  "mbedtls:modexp",
  "openssl:recp",
  "openssl:mont",
  "openssl:mont_consttime",
  "openssl:mont_word",
]
