[campaign]
# Used for direct runs without --docker. Docker mode builds from the
# CLI-provided ABACUS repo path and uses --container-abacus-root inside the
# container.
abacus_root = "/path/to/abacus"
num_copies = 10
tmp_dir = "/tmp"
output = "results/abacus_experiments"
sym_sizes = [4, 16]

[benchmarks]
# Leave the array empty to keep the default ABACUS benchmark set.
# Example: abacus = ["mbedtls"]
abacus = []
