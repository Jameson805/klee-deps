[campaign]
num_copies = 1
max_parallel_workers = 96
temp_dir = "/scratch/$USER/$SLURM_JOB_ID"
output = "/work/yl925/klee-deps/bearssl_aes_ct"
run_time = "5m"
sliced_map_csv = "configs/postprocess/sliced_map.csv"
filtered_locations_csv = "configs/postprocess/filtered_locations.csv"
ideal_config_selection_csv = "configs/postprocess/ideal_config_selection.csv"
by_library_output_prefix = "filtered_reproduction_status_by_library"

[benchmarks]
all = ["bearssl:aes_ct_only"]

[runs]
klee_cf_rand_path_dfs_4 = true
klee_cf_rand_path_dfs_16 = true
klee_eager_rand_path_dfs_4 = true
klee_eager_rand_path_dfs_16 = true
klee_self_comp_dfs_4 = true
klee_self_comp_dfs_16 = true
binsec_4 = true
binsec_16 = true

[run_definitions.klee_cf_rand_path_dfs_4]
tag = "KLEE CF Rand Path DFS 4"
tool = "klee_cf"
destination = "klee_cf_rand_path_dfs_4"
args = ["{run_time}", "--sym-size", "4", "--search", "random-path,dfs"]

[run_definitions.klee_cf_rand_path_dfs_16]
tag = "KLEE CF Rand Path DFS 16"
tool = "klee_cf"
destination = "klee_cf_rand_path_dfs_16"
args = ["{run_time}", "--sym-size", "16", "--search", "random-path,dfs"]

[run_definitions.klee_eager_rand_path_dfs_4]
tag = "KLEE Eager Rand Path DFS 4"
tool = "klee_eager"
destination = "klee_eager_rand_path_dfs_4"
args = ["{run_time}", "--sym-size", "4", "--search", "random-path,dfs"]

[run_definitions.klee_eager_rand_path_dfs_16]
tag = "KLEE Eager Rand Path DFS 16"
tool = "klee_eager"
destination = "klee_eager_rand_path_dfs_16"
args = ["{run_time}", "--sym-size", "16", "--search", "random-path,dfs"]

[run_definitions.klee_self_comp_dfs_4]
tag = "KLEE Self-Comp DFS 4"
tool = "klee_self_comp"
destination = "klee_self_comp_dfs_4"
args = ["{run_time}", "--search", "dfs", "--sym-size", "4"]

[run_definitions.klee_self_comp_dfs_16]
tag = "KLEE Self-Comp DFS 16"
tool = "klee_self_comp"
destination = "klee_self_comp_dfs_16"
args = ["{run_time}", "--search", "dfs", "--sym-size", "16"]

[run_definitions.binsec_4]
tag = "Binsec 4"
tool = "binsec"
destination = "binsec_4"
args = ["{run_time}", "--sym-size", "4"]

[run_definitions.binsec_16]
tag = "Binsec 16"
tool = "binsec"
destination = "binsec_16"
args = ["{run_time}", "--sym-size", "16"]
