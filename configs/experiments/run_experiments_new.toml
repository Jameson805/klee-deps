[campaign]
num_copies = 10
max_parallel_workers = 96
temp_dir = "/scratch/$USER/$SLURM_JOB_ID"
output = "/dkucc/home/yl925/klee-results/20260530_new"
run_time = "2h"
klee_root = "/home/theta-lin/klee/build/bin"
sliced_map_csv = "configs/postprocess/sliced_map.csv"
filtered_locations_csv = "configs/postprocess/filtered_locations.csv"
# ideal_config_selection_csv = "configs/postprocess/ideal_config_selection.csv"
by_library_output_prefix = "filtered_reproduction_status_by_library"

[benchmarks]
# Leave arrays empty to keep each tool's default benchmark set.
# Set `all = ["mbedtls:default"]` to run only Mbed TLS everywhere unless a tool-specific override is set.
all = ["appliedcryp:default", "bearssl:aes_des", "ghostrider:default", "libg:default", "libsodium:curve25519", "openssl_almeida:default", "pycrypto:default"]
abacus = ["appliedcryp:default", "bearssl:aes_des", "ghostrider:default", "libg:default", "openssl_almeida:default", "pycrypto:default"]

[runs]
klee_cf_default_4 = true
klee_cf_default_16 = true
klee_cf_dfs_4 = true
klee_cf_dfs_16 = true
klee_cf_rand_path_dfs_4 = true
klee_cf_rand_path_dfs_16 = true
klee_cf_no_conc_4 = true
klee_eager_default_4 = true
klee_eager_default_16 = true
klee_eager_dfs_4 = true
klee_eager_dfs_16 = true
klee_eager_rand_path_dfs_4 = true
klee_eager_rand_path_dfs_16 = true
klee_self_comp_default_4 = true
klee_self_comp_default_16 = true
klee_self_comp_dfs_4 = true
klee_self_comp_dfs_16 = true
klee_self_comp_rand_path_dfs_4 = true
klee_self_comp_rand_path_dfs_16 = true
binsec_4 = true
binsec_16 = true

[run_definitions.klee_cf_default_4]
tag = "KLEE CF Default 4"
tool = "klee_cf"
destination = "klee_cf_default_4"
args = ["{run_time}", "--sym-size", "4"]

[run_definitions.klee_cf_default_16]
tag = "KLEE CF Default 16"
tool = "klee_cf"
destination = "klee_cf_default_16"
args = ["{run_time}", "--sym-size", "16"]

[run_definitions.klee_cf_dfs_4]
tag = "KLEE CF DFS 4"
tool = "klee_cf"
destination = "klee_cf_dfs_4"
args = ["{run_time}", "--sym-size", "4", "--search", "dfs"]

[run_definitions.klee_cf_dfs_16]
tag = "KLEE CF DFS 16"
tool = "klee_cf"
destination = "klee_cf_dfs_16"
