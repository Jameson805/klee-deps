[campaign]
num_copies = 1
max_parallel_workers = 96
temp_dir = "/scratch/$USER/$SLURM_JOB_ID"
output = "/dkucc/home/yl925/klee-results/20260618_rsa_decrypt"
run_time = "2h"
sliced_map_csv = "configs/postprocess/sliced_map.csv"
filtered_locations_csv = "configs/postprocess/filtered_locations.csv"
by_library_output_prefix = "filtered_reproduction_status_by_library"

[benchmarks]
all = ["bearssl:rsa_stages", "libgcrypt:rsa_stages", "mbedtls:rsa_decrypt_only", "mbedtls:rsa_stages", "openssl:rsa_stages"]
klee_cf = ["bearssl:rsa_stages", "libgcrypt:rsa_stages", "mbedtls:rsa_decrypt_only", "mbedtls:rsa_stages", "openssl:rsa_stages"]
klee_eager = ["bearssl:rsa_stages", "libgcrypt:rsa_stages", "mbedtls:rsa_decrypt_only", "mbedtls:rsa_stages", "openssl:rsa_stages"]
binsec = ["bearssl:rsa_stages", "libgcrypt:rsa_stages", "mbedtls:rsa_decrypt_only", "mbedtls:rsa_stages", "openssl:rsa_stages"]

[runs]
klee_cf_default_4 = true
klee_eager_default_4 = true
binsec_4 = true

[run_definitions.klee_cf_default_4]
tag = "KLEE CF Default 4"
tool = "klee_cf"
destination = "klee_cf_default_4"
args = ["{run_time}", "--sym-size", "4"]

[run_definitions.klee_eager_default_4]
tag = "KLEE Eager Default 4"
tool = "klee_eager"
destination = "klee_eager_default_4"
args = ["{run_time}", "--sym-size", "4"]

[run_definitions.binsec_4]
tag = "Binsec 4"
tool = "binsec"
destination = "binsec_4"
args = ["{run_time}", "--sym-size", "4"]
