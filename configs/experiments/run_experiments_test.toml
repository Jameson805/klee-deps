[campaign]
num_copies = 1
max_parallel_workers = 96
temp_dir = "/scratch/$USER/$SLURM_JOB_ID"
output = "/work/yl925/klee-deps/test"
run_time = "3m"
sliced_map_csv = "configs/postprocess/sliced_map.csv"
filtered_locations_csv = "configs/postprocess/filtered_locations.csv"
#ideal_config_selection_csv = "configs/postprocess/ideal_config_selection.csv"
by_library_output_prefix = "filtered_reproduction_status_by_library"

[benchmarks]
all = ["bearssl:modexp", "hacl_modexp:default", "libgcrypt:default", "mbedtls:default", "openssl:default"]
klee_cf = ["bearssl:modexp", "hacl_modexp:default", "libgcrypt:default", "libgcrypt:sliced", "mbedtls:default", "mbedtls:sliced", "openssl:default", "openssl:sliced"]

[runs]
klee_cf_default_4 = false
klee_cf_default_16 = false
klee_cf_dfs_4 = false
klee_cf_dfs_16 = false
klee_cf_rand_path_dfs_4 = true
klee_cf_rand_path_dfs_16 = false
klee_cf_no_cv_4 = false
klee_eager_default_4 = false
klee_eager_default_16 = false
klee_eager_dfs_4 = false
klee_eager_dfs_16 = false
klee_eager_rand_path_dfs_4 = true
klee_eager_rand_path_dfs_16 = false
klee_self_comp_default_4 = false
klee_self_comp_default_16 = false
klee_self_comp_dfs_4 = false
klee_self_comp_dfs_16 = false
klee_self_comp_rand_path_dfs_4 = true
klee_self_comp_rand_path_dfs_16 = false
binsec_4 = true
binsec_16 = false

[run_definitions.klee_cf_default_4]
tag = "KLEE CF Default 4"
tool = "klee_cf"
destination = "klee_cf_default_4"
args = ["{run_time}", "--sym-size", "4"]

[run_definitions.klee_eager_default_4]
tag = "KLEE Eager Default 4"
tool = "klee_eager"
destination = "klee_eager_default_4"
args = ["{run_time}", "--sym-size", "4"]

[run_definitions.klee_self_comp_dfs_4]
tag = "KLEE Self-Comp DFS 4"
tool = "klee_self_comp"
destination = "klee_self_comp_dfs_4"
args = ["{run_time}", "--search", "dfs", "--sym-size", "4"]

[run_definitions.klee_cf_rand_path_dfs_4]
tag = "KLEE CF Rand Path DFS 4"
tool = "klee_cf"
destination = "klee_cf_rand_path_dfs_4"
args = ["{run_time}", "--sym-size", "4", "--search", "random-path,dfs"]

[run_definitions.klee_eager_rand_path_dfs_4]
tag = "KLEE Eager Rand Path DFS 4"
tool = "klee_eager"
destination = "klee_eager_rand_path_dfs_4"
args = ["{run_time}", "--sym-size", "4", "--search", "random-path,dfs"]

[run_definitions.klee_self_comp_rand_path_dfs_4]
tag = "KLEE Self-Comp Rand Path DFS 4"
tool = "klee_self_comp"
destination = "klee_self_comp_rand_path_dfs_4"
args = ["{run_time}", "--search", "random-path,dfs", "--sym-size", "4"]

[run_definitions.binsec_4]
tag = "Binsec 4"
tool = "binsec"
destination = "binsec_4"
args = ["{run_time}", "--sym-size", "4"]
