[[inputs]]
id = "key_buf"
name = "key"
kind = "secret"
size = "KEY_LEN"

[[inputs]]
id = "message_buf"
name = "message"
kind = "public"
size = "MESSAGE_LEN"

[mode_policy.var_pub]
public_symbolic = true

[mode_policy.fix_pub]
