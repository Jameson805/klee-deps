[[inputs]]
id = "key_buf"
name = "key"
kind = "secret"
size = "KEY_LEN"

[[inputs]]
id = "data_buf"
name = "data"
kind = "public"
size = "DATA_LEN"

[[inputs]]
id = "iv_buf"
name = "iv"
kind = "public"
size = "IV_LEN"

[mode_policy.var_pub]
public_symbolic = true

[mode_policy.fix_pub]
public_symbolic = false

[mode_policy.abacus]
secret_inputs = ["key_buf"]
public_fixed = true

[presets.default.macros]
KEY_LEN = 16
DATA_LEN = 16
IV_LEN = 16

[presets.default.vars]
data_buf = [
	0x4b, 0x21, 0x30, 0xa3, 0x94, 0x18, 0xb6, 0x0b,
	0xc2, 0x47, 0x60, 0x76, 0x94, 0xcb, 0x20, 0xb9,
]
iv_buf = 0

[presets.default.abacus_secrets]
key_buf = [
	0x00, 0x11, 0x22, 0x33, 0x44, 0x55, 0x66, 0x77,
	0x88, 0x99, 0xaa, 0xbb, 0xcc, 0xdd, 0xee, 0xff,
]